global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'quorum-nodes'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'node-1:8080'
          - 'node-2:8080'
          - 'node-3:8080'
        labels:
          tier: 'control-plane'

  - job_name: 'quorum-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'worker-1:9090'
          - 'worker-2:9090'
        labels:
          tier: 'worker-fleet'
